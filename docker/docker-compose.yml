# 从仓库根目录执行：docker compose -f docker/docker-compose.yml --env-file .env up -d
# （--env-file 用于 compose 内 ${MYSQL_HOST_PORT}、${DEEPSEEK_API_KEY} 等插值；MySQL 凭证由各服务 env_file 读根目录 .env）

services:
  # 在项目根目录执行：docker compose -f docker/docker-compose.yml --env-file .env up -d
  minio:
    image: quay.io/minio/minio
    container_name: minio-server
    ports:
      - '9000:9000' # API 端口
      - '9001:9001' # 控制台端口
    environment:
      # 与业务进程中的 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 保持一致（均从项目根 .env 读取）
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./data:/data # 文件映射地址
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - app_net

  pageindex-api:
    build:
      context: .
      dockerfile: pageindex.Dockerfile
    container_name: pageindex-api
    ports:
      - "9090:9090"
    environment:
      - OPENAI_API_BASE=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_API_KEY=${DEEPSEEK_API_KEY}

    volumes:
      - ./pageindex_data:/app/output # 存放向量索引和解析结果
    restart: always
    networks:
      - app_net

  # 自动创建 bucket 的可选工具容器
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/mc alias set myminio http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        /usr/bin/mc mb -p "myminio/$$MINIO_BUCKET_NAME" || true
        /usr/bin/mc anonymous set public "myminio/$$MINIO_BUCKET_NAME"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
